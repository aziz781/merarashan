name: iOS Release Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    # Capacitor 8 requires Xcode 26, which is only available on macos-15+ runners.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Select latest Xcode
        # Capacitor 8 xcframework needs Xcode 26+. Pick the newest Xcode installed on the runner.
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Compute versionCode / versionName
        id: version
        run: |
          BASE=10
          VCODE=$((BASE + GITHUB_RUN_NUMBER))
          VNAME="1.0.${GITHUB_RUN_NUMBER}"
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "vname=$VNAME" >> "$GITHUB_OUTPUT"
          echo "Building versionCode=$VCODE versionName=$VNAME"

      - name: Build web assets
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.vname }}
          APP_VERSION_CODE: ${{ steps.version.outputs.vcode }}
        run: npm run build

      - name: Add iOS platform (if missing)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          fi

      - name: Bump marketing & build versions
        working-directory: ios/App
        env:
          VNAME: ${{ steps.version.outputs.vname }}
          VCODE: ${{ steps.version.outputs.vcode }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VNAME" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VCODE" App/Info.plist || true
          xcrun agvtool new-marketing-version "$VNAME" || true
          xcrun agvtool new-version -all "$VCODE" || true

      - name: Detect signing secrets
        id: signing
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ] && [ -n "$PROVISION_BASE64" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS signing secrets not set — building unsigned archive. Add IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, IOS_TEAM_ID, IOS_CODE_SIGN_IDENTITY to produce a signed .ipa."
          fi

      - name: Import signing certificate & provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROVISION_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: temp-ci-keychain-pass
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "$P12_BASE64" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISION_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

      - name: Validate provisioning profile
        if: steps.signing.outputs.signed == 'true'
        env:
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -e
          PROFILE=~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision
          if [ ! -f "$PROFILE" ]; then
            echo "::error::Provisioning profile not found at $PROFILE"
            exit 1
          fi

          # Decode the CMS-wrapped .mobileprovision into plist XML
          PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PROFILE" > "$PLIST"

          BUNDLE_ID="${IOS_BUNDLE_ID:-pk.merarashan.app}"
          METHOD="${EXPORT_METHOD:-app-store}"

          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PLIST")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PLIST")
          PROFILE_TEAM=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$PLIST")
          PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$PLIST")
          # Strip leading "<TEAMID>." prefix
          PROFILE_BUNDLE_ID="${PROFILE_APP_ID#*.}"

          # Detect distribution type
          HAS_DEVICES=$(/usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" "$PLIST" 2>/dev/null && echo yes || echo no)
          HAS_GET_TASK_ALLOW=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" "$PLIST" 2>/dev/null || echo false)

          echo "Profile name:       $PROFILE_NAME"
          echo "Profile UUID:       $PROFILE_UUID"
          echo "Profile team:       $PROFILE_TEAM"
          echo "Profile bundle ID:  $PROFILE_BUNDLE_ID"
          echo "Expected bundle ID: $BUNDLE_ID"
          echo "Expected team:      $TEAM_ID"
          echo "Expected method:    $METHOD"
          echo "Expected name:      $PROVISIONING_PROFILE_NAME"

          FAIL=0

          if [ "$PROFILE_NAME" != "$PROVISIONING_PROFILE_NAME" ]; then
            echo "::error::Profile name mismatch. Profile is '$PROFILE_NAME' but IOS_PROVISIONING_PROFILE_NAME secret is '$PROVISIONING_PROFILE_NAME'. Xcode looks profiles up by name and will fail to find a match."
            FAIL=1
          fi

          # Wildcard profiles end in *
          case "$PROFILE_BUNDLE_ID" in
            "$BUNDLE_ID") : ;;
            *\*)
              PREFIX="${PROFILE_BUNDLE_ID%\*}"
              case "$BUNDLE_ID" in
                "$PREFIX"*) : ;;
                *)
                  echo "::error::Bundle ID '$BUNDLE_ID' does not match wildcard profile '$PROFILE_BUNDLE_ID'."
                  FAIL=1 ;;
              esac ;;
            *)
              echo "::error::Profile is for bundle ID '$PROFILE_BUNDLE_ID' but app bundle ID is '$BUNDLE_ID'."
              FAIL=1 ;;
          esac

          if [ -n "$TEAM_ID" ] && [ "$PROFILE_TEAM" != "$TEAM_ID" ]; then
            echo "::error::Profile team '$PROFILE_TEAM' does not match IOS_TEAM_ID '$TEAM_ID'."
            FAIL=1
          fi

          # Method vs profile type:
          #   app-store / app-store-connect: distribution, no devices, get-task-allow=false
          #   ad-hoc: distribution, has ProvisionedDevices
          #   development: get-task-allow=true, has ProvisionedDevices
          #   enterprise: ProvisionsAllDevices=true
          HAS_ALL_DEVICES=$(/usr/libexec/PlistBuddy -c "Print :ProvisionsAllDevices" "$PLIST" 2>/dev/null || echo false)
          case "$METHOD" in
            app-store|app-store-connect)
              if [ "$HAS_DEVICES" = "yes" ] || [ "$HAS_ALL_DEVICES" = "true" ] || [ "$HAS_GET_TASK_ALLOW" = "true" ]; then
                echo "::error::Export method is '$METHOD' but provisioning profile is not an App Store distribution profile (has devices or get-task-allow). Create an 'App Store' distribution profile in Apple Developer."
                FAIL=1
              fi ;;
            ad-hoc)
              if [ "$HAS_DEVICES" != "yes" ]; then
                echo "::error::Export method is 'ad-hoc' but profile has no ProvisionedDevices."
                FAIL=1
              fi ;;
            development)
              if [ "$HAS_GET_TASK_ALLOW" != "true" ]; then
                echo "::error::Export method is 'development' but profile is not a development profile (get-task-allow != true)."
                FAIL=1
              fi ;;
            enterprise)
              if [ "$HAS_ALL_DEVICES" != "true" ]; then
                echo "::error::Export method is 'enterprise' but profile is not an in-house/enterprise profile."
                FAIL=1
              fi ;;
            *)
              echo "::warning::Unknown export method '$METHOD' — skipping method/profile-type check." ;;
          esac

          # Verify signing identity in keychain matches the profile's team
          IDENTITIES=$(security find-identity -v -p codesigning | grep -c "$PROFILE_TEAM" || true)
          if [ "$IDENTITIES" -eq 0 ]; then
            echo "::error::No code-signing identity in keychain matches profile team '$PROFILE_TEAM'. Check IOS_P12_BASE64 contains the matching distribution certificate."
            FAIL=1
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::Provisioning profile validation failed — fix the secrets above before re-running."
            exit 1
          fi
          echo "✅ Provisioning profile validated."

      - name: Apply signing settings to App target only
        if: steps.signing.outputs.signed == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          CODE_SIGN_IDENTITY: ${{ secrets.IOS_CODE_SIGN_IDENTITY }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          # Firebase SPM products (Firebase_FirebaseCore etc.) are resource
          # bundles / library targets that cannot accept a provisioning
          # profile. Passing PROVISIONING_PROFILE_SPECIFIER on the xcodebuild
          # command line applies it to ALL targets and triggers:
          #   "Firebase_FirebaseCore does not support provisioning profiles"
          # Instead, bake the signing config into the App target's Release
          # configuration only, then archive without command-line overrides.
          sudo gem install xcodeproj --no-document
          ruby <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('App.xcodeproj')
          target = project.targets.find { |t| t.name == 'App' } or abort "App target not found"
          target.build_configurations.each do |config|
            next unless config.name == 'Release'
            bs = config.build_settings
            bs['CODE_SIGN_STYLE'] = 'Manual'
            bs['DEVELOPMENT_TEAM'] = ENV['TEAM_ID']
            bs['PROVISIONING_PROFILE_SPECIFIER'] = ENV['PROVISIONING_PROFILE_NAME']
            bs['CODE_SIGN_IDENTITY'] = ENV['CODE_SIGN_IDENTITY']
            bs['CODE_SIGN_IDENTITY[sdk=iphoneos*]'] = ENV['CODE_SIGN_IDENTITY']
            bs['PROVISIONING_PROFILE'] = ''
          end
          project.save
          puts "✅ Wrote signing settings into App target (Release) only."
          RUBY

      - name: Build signed archive & export IPA
        if: steps.signing.outputs.signed == 'true'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}

        run: |
          WORKSPACE="App.xcworkspace"
          [ -d "$WORKSPACE" ] || WORKSPACE="App.xcodeproj"
          FLAG="-workspace"; [ "$WORKSPACE" = "App.xcodeproj" ] && FLAG="-project"
          METHOD="${EXPORT_METHOD:-app-store}"

          # NOTE: do NOT pass CODE_SIGN_IDENTITY / PROVISIONING_PROFILE_SPECIFIER
          # here — those settings are now baked into the App target only.
          # Passing them on the command line would re-apply them to Firebase
          # SPM targets and break the archive.
          xcodebuild $FLAG "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -skipPackagePluginValidation \
            archive

          BUNDLE_ID="${IOS_BUNDLE_ID:-pk.merarashan.app}"
          cat > $RUNNER_TEMP/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadBitcode</key><false/>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROVISIONING_PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export


      - name: Build unsigned archive (no signing secrets)
        if: steps.signing.outputs.signed != 'true'
        working-directory: ios/App
        run: |
          WORKSPACE="App.xcworkspace"
          [ -d "$WORKSPACE" ] || WORKSPACE="App.xcodeproj"
          FLAG="-workspace"; [ "$WORKSPACE" = "App.xcodeproj" ] && FLAG="-project"

          xcodebuild $FLAG "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Upload IPA artifact
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload xcarchive artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-xcarchive
          path: ${{ runner.temp }}/App.xcarchive
          if-no-files-found: error

      - name: Detect TestFlight secrets
        id: tf
        if: steps.signing.outputs.signed == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TestFlight upload skipped — set APPSTORE_API_KEY_ID, APPSTORE_API_ISSUER_ID, APPSTORE_API_PRIVATE_KEY_BASE64 secrets to enable."
          fi

      - name: Upload to TestFlight
        if: steps.signing.outputs.signed == 'true' && steps.tf.outputs.ready == 'true'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          # altool looks up keys in ~/.appstoreconnect/private_keys/AuthKey_<KEY_ID>.p8
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8

          IPA_PATH=$(ls ${{ runner.temp }}/export/*.ipa | head -n1)
          echo "Uploading $IPA_PATH to TestFlight..."

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

