<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline — Mera Rashan</title>
    <meta name="theme-color" content="#3B82F6" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: linear-gradient(180deg, hsl(158 45% 97%), hsl(158 30% 92%));
        color: hsl(158 30% 12%);
        display: flex; align-items: center; justify-content: center;
        padding: 24px; text-align: center;
      }
      .card {
        max-width: 420px; background: #fff; border-radius: 20px; padding: 32px 24px;
        box-shadow: 0 20px 50px -10px hsl(158 60% 20% / 0.18);
      }
      img { width: 96px; height: 96px; margin-bottom: 16px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p  { font-size: 15px; color: hsl(158 15% 30%); margin: 0 0 20px; }
      button {
        background: #3B82F6; color: #fff; border: 0; border-radius: 10px;
        padding: 12px 20px; font-size: 15px; font-weight: 600; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: hsl(158 30% 8%); color: hsl(158 25% 94%); }
        .card { background: hsl(158 28% 11%); }
        p { color: hsl(158 15% 70%); }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/mera-rashan-logo.webp" alt="Mera Rashan" />
      <h1>You're offline</h1>
      <p>Mera Rashan needs an internet connection to load fresh data. Cached pages will still open — try again when you're back online.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
